[package]
name = "devhub-app"
version = "0.4.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devhub_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is required to expose the cached cover images to the webview
# through the `asset:` protocol (convertFileSrc on the frontend).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cross-checks DNS answers before we pin an IP (downloader layer 2).
hickory-resolver = "0.26"
# hickory 0.26 is async-only; the DNS cross-check drives it on a small current-thread runtime.
tokio = { version = "1", features = ["rt", "net", "time"] }
# Formats the bootstrap marker timestamp as a readable ISO 8601 string.
# Already present in the tree via Tauri, declared here so we do not rely on a
# transitive dependency.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tauri-plugin-dialog = "2"
# Guarantees only one DevHub instance runs at a time. Two instances sharing the
# same 项目/ directory would race on .devhub.json and the activity log.
tauri-plugin-single-instance = "2"
# Decodes native tool output that is not UTF-8. Windows formats its message
# strings in the OEM codepage (936/GBK on a zh-CN install), so `curl`'s error
# text arrived as replacement characters. Pure Rust, and the alternative was
# writing a codepage table by hand.
encoding_rs = "0.8"
trash = "5.2.9"
# N2: 仓库内容全文搜索——regex + walkdir。
regex = "1"
walkdir = "2"
# r27-R3: verify GitHub release assets against the API's sha256 digest.
sha2 = "0.10"

# Reads the Windows `Uninstall` and `App Paths` registry keys to find installed
# editors (`idescan`). Already present in the tree via Tauri, declared here so we
# do not rely on a transitive dependency.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

